<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Papelaria - Controle de Produtos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Papelaria</h1>
      <p>Controle de produtos e estoque</p>
    </header>

    <main>
      <p id="mensagem-sucesso" class="mensagem-sucesso" role="status" aria-live="polite" hidden></p>

      <section class="cartao" aria-labelledby="titulo-formulario">
        <h2 id="titulo-formulario">Novo produto</h2>
        <form id="form-produto">
          <div class="campo-formulario campo-nome">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" maxlength="60" placeholder="Ex: Caderno" autocomplete="off" required />
          </div> 

          <div class="campo-formulario">
            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" name="preco" step="0.01" min="0" placeholder="Ex: 12.50" required />
          </div>

          <div class="campo-formulario">
            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" name="quantidade" min="1" placeholder="Ex: 10" required />
          </div>

          <div class="campo-formulario campo-descricao">
            <label for="descricao">Descrição do produto</label>
            <textarea id="descricao" name="descricao" maxlength="240" rows="3" placeholder="Ex: Caderno universitário com capa dura"></textarea>
          </div>

          <p id="mensagem-erro-batata" class="mensagem-erro" role="alert" aria-live="assertive"></p>

          <div class="acoes-formulario">
            <button type="submit" id="botao-formulario">Adicionar produto</button>
            <button type="button" id="botao-cancelar-edicao" class="botao-secundario" hidden>Cancelar edição</button>
          </div>
        </form>
      </section>

      <section class="cartao" aria-labelledby="titulo-produtos">
        <div class="cabecalho-lista">
          <h2 id="titulo-produtos">Produtos cadastrados</h2>
          <p id="contador-produtos-batata" class="contador-produtos">Carregando produtos...</p>
        </div>

        <div class="ferramentas-lista">
          <div class="campo-ferramenta campo-busca">
            <label for="busca-produto">Pesquisar</label>
            <input type="search" id="busca-produto" placeholder="Buscar por nome ou descrição" autocomplete="off" />
          </div>

          <div class="campo-ferramenta">
            <label for="ordenacao-produtos">Ordenar por</label>
            <select id="ordenacao-produtos">
              <option value="nome">Nome (A–Z)</option>
              <option value="preco-crescente">Menor preço</option>
              <option value="preco-decrescente">Maior preço</option>
              <option value="quantidade-crescente">Menor estoque</option>
              <op tion value="quantidade-decrescente">Maior estoque</option>
            </select>
          </div>
        </div>

        <p id="mensagem-vazia-batata" class="mensagem-vazia" hidden>Nenhum produto cadastrado.</p>
        <ul id="lista-produtos" aria-live="polite"></ul>
      </section>
    </main>

    <footer id="rodape-batata">
      <p>Papelaria - Projeto desenvolvido com HTML, CSS e JavaScript.</p>
      <p class="creditos-imagens">Ícones por <a href="https://openmoji.org/" target="_blank" rel="noopener noreferrer">OpenMoji</a> e imagens via <a href="https://openverse.org/" target="_blank" rel="noopener noreferrer">Openverse</a>.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
